<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="rock-paper-scissors.js" defer> </script> 
  </head>
  <body>

    <h1 style="font-size: 40px; text-align: center;">Play Rock Paper Scissors!</h1>
    
    <div class="game">
      <div class="instruction">Choose your move:</div>
      <div class="buttons">
        <button id = "rock"><img src="./images/rock.png" alt="Rock" height="100px" width="100px"></button>
        <button id = "paper"><img src="./images/paper.png" alt="Paper"height="100px" width="100px"></button>
        <button id = "scissors"><img src="./images/scissors.png" alt="Scissors"height="100px" width="100px"></button>
      </div>
    </div>

  </body>

</html>
